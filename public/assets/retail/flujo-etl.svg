<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flujo de trabajo ETL asistido por orquestación de agentes de IA, con auditoría humana">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFFFFF"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#000000"/>

  <!-- Header -->
  <text x="80" y="92" font-family="Geist, system-ui, sans-serif" font-size="46" font-weight="600" fill="#FFFFFF" letter-spacing="-1">Flujo de trabajo</text>
  <text x="80" y="128" font-family="Geist, system-ui, sans-serif" font-size="18" fill="#B3B3B3">ETL asistido por orquestación de agentes de IA, con auditoría humana en cada etapa.</text>
  <line x1="80" y1="160" x2="1520" y2="160" stroke="#404040"/>

  <!-- Human (top, oversees) -->
  <g transform="translate(760,182)">
    <circle cx="40" cy="16" r="13" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
    <path d="M16 52 a24 24 0 0 1 48 0" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
  </g>
  <text x="800" y="268" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="15" letter-spacing="2" fill="#B3B3B3">AUDITORÍA HUMANA</text>
  <text x="800" y="291" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#B3B3B3">revisa y aprueba en cada gate</text>
  <line x1="800" y1="300" x2="800" y2="330" stroke="#B3B3B3" stroke-width="1.6"/>
  <!-- Oversight bracket over the pipeline -->
  <path d="M140 330 H1460" stroke="#B3B3B3" stroke-width="1.6"/>
  <g stroke="#B3B3B3" stroke-width="1.6">
    <line x1="280" y1="330" x2="280" y2="352"/>
    <line x1="640" y1="330" x2="640" y2="352"/>
    <line x1="1000" y1="330" x2="1000" y2="352"/>
    <line x1="1360" y1="330" x2="1360" y2="352"/>
  </g>

  <!-- Orchestration band (AI) -->
  <rect x="140" y="392" width="1320" height="84" rx="12" fill="#262626" stroke="#404040"/>
  <g transform="translate(176,416)" stroke="#FFFFFF" stroke-width="2.2" fill="none">
    <rect x="0" y="6" width="42" height="34" rx="9"/>
    <line x1="21" y1="-8" x2="21" y2="6"/>
    <circle cx="21" cy="-11" r="3" fill="#FFFFFF" stroke="none"/>
    <circle cx="13" cy="23" r="3.2" fill="#FFFFFF" stroke="none"/>
    <circle cx="29" cy="23" r="3.2" fill="#FFFFFF" stroke="none"/>
  </g>
  <text x="248" y="431" font-family="'Geist Mono', ui-monospace, monospace" font-size="14" letter-spacing="1.5" fill="#B3B3B3">ORQUESTACIÓN IA</text>
  <text x="248" y="455" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#B3B3B3">un agente dirige el proceso y usa las herramientas</text>
  <g font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#FFFFFF">
    <rect x="820" y="417" width="110" height="34" rx="17" fill="#262626" stroke="#404040"/><text x="875" y="439" text-anchor="middle">SDD</text>
    <rect x="944" y="417" width="118" height="34" rx="17" fill="#262626" stroke="#404040"/><text x="1003" y="439" text-anchor="middle">Skills</text>
    <rect x="1076" y="417" width="146" height="34" rx="17" fill="#262626" stroke="#404040"/><text x="1149" y="439" text-anchor="middle">Subagentes</text>
    <rect x="1236" y="417" width="120" height="34" rx="17" fill="#262626" stroke="#404040"/><text x="1296" y="439" text-anchor="middle">Agentes</text>
  </g>
  <text x="1380" y="439" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#B3B3B3">MCP</text>

  <!-- Connector from orchestration to pipeline -->
  <line x1="800" y1="476" x2="800" y2="520" stroke="#FFFFFF" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ETL stages -->
  <g font-family="Geist, system-ui, sans-serif">
    <!-- Arrows between cards -->
    <line x1="404" y1="640" x2="436" y2="640" stroke="#FFFFFF" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="764" y1="640" x2="796" y2="640" stroke="#FFFFFF" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="1124" y1="640" x2="1156" y2="640" stroke="#FFFFFF" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 1 Extracción -->
    <rect x="80" y="540" width="320" height="200" rx="12" fill="#262626" stroke="#404040"/>
    <text x="104" y="578" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" letter-spacing="2" fill="#B3B3B3">EXTRACCIÓN</text>
    <g transform="translate(104,596)" stroke="#FFFFFF" stroke-width="2.2" fill="none">
      <circle cx="16" cy="16" r="12"/><line x1="25" y1="25" x2="38" y2="38"/>
    </g>
    <text x="104" y="672" font-size="20" font-weight="600" fill="#FFFFFF">Python · scraping</text>
    <text x="104" y="700" font-size="14" fill="#B3B3B3">reglas de IA para leer</text>
    <text x="104" y="720" font-size="14" fill="#B3B3B3">retailers de Cuenca</text>

    <!-- 2 Limpieza -->
    <rect x="440" y="540" width="320" height="200" rx="12" fill="#262626" stroke="#404040"/>
    <text x="464" y="578" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" letter-spacing="2" fill="#B3B3B3">LIMPIEZA</text>
    <g transform="translate(464,596)" stroke="#FFFFFF" stroke-width="2.2" fill="none">
      <path d="M16 4 C24 16 28 22 28 28 A12 12 0 1 1 4 28 C4 22 8 16 16 4 Z"/>
    </g>
    <text x="464" y="672" font-size="20" font-weight="600" fill="#FFFFFF">Python</text>
    <text x="464" y="700" font-size="14" fill="#B3B3B3">normaliza, deduplica</text>
    <text x="464" y="720" font-size="14" fill="#B3B3B3">y valida la calidad</text>

    <!-- 3 Carga -->
    <rect x="800" y="540" width="320" height="200" rx="12" fill="#262626" stroke="#404040"/>
    <text x="824" y="578" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" letter-spacing="2" fill="#B3B3B3">CARGA</text>
    <g transform="translate(824,596)" stroke="#FFFFFF" stroke-width="2.2" fill="none">
      <ellipse cx="16" cy="8" rx="14" ry="6"/>
      <path d="M2 8 V32 A14 6 0 0 0 30 32 V8"/>
      <path d="M2 20 A14 6 0 0 0 30 20"/>
    </g>
    <text x="824" y="672" font-size="20" font-weight="600" fill="#FFFFFF">SQL Server</text>
    <text x="824" y="700" font-size="14" fill="#B3B3B3">modelo relacional</text>
    <text x="824" y="720" font-size="14" fill="#B3B3B3">y carga a la base</text>

    <!-- 4 Visualización -->
    <rect x="1160" y="540" width="320" height="200" rx="12" fill="#262626" stroke="#404040"/>
    <text x="1184" y="578" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" letter-spacing="2" fill="#B3B3B3">VISUALIZACIÓN</text>
    <g transform="translate(1184,600)" stroke="none" fill="#FFFFFF">
      <rect x="0" y="20" width="8" height="18" rx="2"/>
      <rect x="14" y="10" width="8" height="28" rx="2"/>
      <rect x="28" y="2" width="8" height="36" rx="2"/>
    </g>
    <text x="1184" y="672" font-size="20" font-weight="600" fill="#FFFFFF">Power BI</text>
    <text x="1184" y="700" font-size="14" fill="#B3B3B3">dashboard de</text>
    <text x="1184" y="720" font-size="14" fill="#B3B3B3">precios y marcas</text>
  </g>

  <text x="800" y="812" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#B3B3B3">La IA ejecuta y propone; el humano audita y aprueba antes de avanzar.</text>
</svg>
